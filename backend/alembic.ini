[alembic]
script_location = alembic
prepend_sys_path = .
# Revision IDs are UUIDs (alembic's default); filenames are renamed by hand
# to a sequential numeric prefix (1_slug.py, 2_slug.py, ...) after each
# `alembic revision --autogenerate` — the `revision` field inside the file
# is left untouched, only the filename on disk changes.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
