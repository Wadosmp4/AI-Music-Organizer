services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: sqlite:////app/data/app.db
    volumes:
      - sqlite_data:/app/data
    # Pinned at 1 (KTD22/KTD26): the ingestion job (U4) runs as a single
    # dedicated process. A second replica would double-fire every job.
    deploy:
      replicas: 1

  web:
    build: ./web
    ports:
      - "5173:5173"
    volumes:
      - ./web/src:/app/src
      - ./web/tests:/app/tests
      - ./web/index.html:/app/index.html
    depends_on:
      - backend

volumes:
  sqlite_data:
